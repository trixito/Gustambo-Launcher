name: Parche y compilar
on:
  push:
    paths: ['parche*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Aplicar parche
        run: |
          shopt -s nullglob
          for z in parche*.zip; do
            unzip -o "$z" -d .
            rm "$z"
          done
          if [ -f delete.txt ]; then
            xargs -a delete.txt -r rm -rf
            rm delete.txt
          fi
          git config user.name "parche-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Aplicar parche"
          git push
      - name: Compilar
        run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GustamboClient
          path: HMCL/build/libs/*.jar
